<!DOCTYPE html>
<html>
<head>

<title>Browser Extension Privacy Analyzer</title>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="header">
<h2>🔐 Browser Extension Privacy Analyzer</h2>
</div>

<div class="container mt-5">

<div class="card p-4 text-center">

<h5>Upload Extension Manifest</h5>

<input type="file" id="manifestFile" class="form-control mt-3">

<button onclick="analyzeManifest()" class="btn btn-primary mt-3">
Analyze Extension
</button>

</div>

<div class="card p-4 mt-4">

<h4>Permissions</h4>

<ul id="permissionsList" class="list-group"></ul>

</div>

<div class="card p-4 mt-4 text-center">

<h4>Risk Score</h4>

<div class="progress mt-3">

<div id="riskBar" class="progress-bar bg-danger" style="width:0%">
0
</div>

</div>

</div>

<div class="card p-4 mt-4">

<h4>Warnings</h4>

<ul id="warningsList" class="list-group"></ul>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>
<div style="margin-top:40px; text-align:center;">
    <button onclick="downloadReport()" class="btn btn-success">
        Download Security Report
    </button>
</div>

</body>
</html>
